##########################################################################
# Title:         Guardarr (Saltbox integration) | Default Variables      #
# Author(s):     n3phz                                                   #
# URL:           https://github.com/n3phz/guardarr                       #
##########################################################################
---
################################
# Basics
################################

guardarr_instances: ["guardarr"]

################################
# Paths
################################

guardarr_role_paths_folder: "{{ guardarr_name }}"
guardarr_role_paths_location: "{{ server_appdata_path }}/{{ guardarr_role_paths_folder }}"
guardarr_role_paths_folders_list:
  - "{{ guardarr_role_paths_location }}"

################################
# Storage Boundary
################################

# Host path monitored by Guardarr via statvfs()/stat() (read-only inside the container).
# /mnt/unionfs is the Saltbox mergerfs unified storage mount — verified on saltbox2:
#   mergerfs 7.3T, mounted rw,nosuid,nodev,noatime,...,allow_other
guardarr_storage_path: "/mnt/unionfs"

################################
# Web / Traefik
################################

guardarr_role_web_subdomain: "{{ guardarr_name }}"
guardarr_role_web_domain: "{{ user.domain }}"
guardarr_role_web_port: "8000"
guardarr_role_web_url: "{{ lookup('role_web', role='guardarr', scheme='https') }}"

################################
# DNS
################################

guardarr_role_dns_record: "{{ lookup('role_var', '_web_subdomain', role='guardarr') }}"
guardarr_role_dns_zone: "{{ lookup('role_var', '_web_domain', role='guardarr') }}"
guardarr_role_dns_proxy: "{{ dns_proxied }}"

################################
# Traefik
################################

guardarr_role_traefik_enabled: true
guardarr_role_traefik_api_enabled: true
# API endpoints that should bypass Authelia (for SPA API calls)
guardarr_role_traefik_api_endpoint: "PathPrefix(`/api`)"

guardarr_role_traefik_sso_middleware: "{{ traefik_default_sso_middleware }}"
guardarr_role_traefik_middleware_default: "{{ traefik_default_middleware
                                            + (',themepark-' + guardarr_name
                                               if (lookup('role_var', '_themepark_enabled', role='guardarr') and global_themepark_plugin_enabled)
                                               else '') }}"
guardarr_role_traefik_middleware_custom: ""
guardarr_role_traefik_middleware_default_api: "{{ traefik_default_middleware_api }}"
guardarr_role_traefik_middleware_custom_api: ""
guardarr_role_traefik_certresolver: "{{ traefik_default_certresolver }}"

################################
# Theme
################################

guardarr_role_themepark_enabled: false
guardarr_role_themepark_app: "guardarr"
guardarr_role_themepark_theme: "{{ global_themepark_theme }}"
guardarr_role_themepark_domain: "{{ global_themepark_domain }}"
guardarr_role_themepark_addons: []

################################
# Docker
################################

# Container
guardarr_role_docker_container: "{{ guardarr_name }}"

# Image
guardarr_role_docker_image_pull: true
guardarr_role_docker_image_repo: "ghcr.io/n3phz/guardarr"
# Published immutable version tag (ghcr.io/n3phz/guardarr:0.1.1 verified 2026-09-26).
guardarr_role_docker_image_tag: "0.1.2"
guardarr_role_docker_image: "{{ lookup('role_var', '_docker_image_repo', role='guardarr') }}:{{ lookup('role_var', '_docker_image_tag', role='guardarr') }}"

# Envs
# PUID/PGID are honored by docker-entrypoint.sh (remaps the guardarr user and
# drops privileges before launching uvicorn). uid/gid come from Saltbox global
# inventory (ansible_local.saltbox.users[user.name]).
guardarr_role_docker_envs_default:
  PUID: "{{ uid }}"
  PGID: "{{ gid }}"
  GUARDARR_DATA_DIR: "/config"
  GUARDARR_STORAGE_PATH: "/data"
  DATABASE_URL: "sqlite:////config/guardarr.db"
  TZ: "{{ tz }}"
guardarr_role_docker_envs_custom: {}
guardarr_role_docker_envs: "{{ lookup('role_var', '_docker_envs_default', role='guardarr')
                               | combine(lookup('role_var', '_docker_envs_custom', role='guardarr')) }}"

# Volumes
guardarr_role_docker_volumes_default:
  - "{{ lookup('role_var', '_paths_location', role='guardarr') }}:/config"
  - "{{ lookup('role_var', '_storage_path', role='guardarr') }}:/data:ro"
guardarr_role_docker_volumes_custom: []
guardarr_role_docker_volumes: "{{ lookup('role_var', '_docker_volumes_default', role='guardarr')
                                  + lookup('role_var', '_docker_volumes_custom', role='guardarr') }}"

# Hostname
guardarr_role_docker_hostname: "{{ guardarr_name }}"

# Networks
guardarr_role_docker_networks_alias: "{{ guardarr_name }}"
guardarr_role_docker_networks_default: []
guardarr_role_docker_networks_custom: []
guardarr_role_docker_networks: "{{ docker_networks_common
                                   + lookup('role_var', '_docker_networks_default', role='guardarr')
                                   + lookup('role_var', '_docker_networks_custom', role='guardarr') }}"

# Restart Policy
guardarr_role_docker_restart_policy: unless-stopped

# Healthcheck (matches the image's built-in HEALTHCHECK; explicit here so Saltbox
# autoheal/diun see a consistent definition)
guardarr_role_docker_healthcheck:
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
  interval: 30s
  timeout: 5s
  start_period: 10s
  retries: 3

# Labels
guardarr_role_docker_labels_default: {}
guardarr_role_docker_labels_custom: {}
guardarr_role_docker_labels: "{{ lookup('role_var', '_docker_labels_default', role='guardarr')
                                 | combine((traefik_themepark_labels
                                          if (lookup('role_var', '_themepark_enabled', role='guardarr') and global_themepark_plugin_enabled)
                                          else {}),
                                         lookup('role_var', '_docker_labels_custom', role='guardarr')) }}"

################################
# Traefik Labels
################################

guardarr_role_docker_labels_traefik_default: |
  traefik.enable=true
  traefik.http.routers.{{ guardarr_name }}-http.entrypoints={{ traefik_entrypoint_web }}
  traefik.http.routers.{{ guardarr_name }}-http.service={{ guardarr_name }}-http
  traefik.http.routers.{{ guardarr_name }}-http.rule={{ traefik_host_template }}
  traefik.http.routers.{{ guardarr_name }}-http.priority=20
  traefik.http.routers.{{ guardarr_name }}-http.middlewares={{ lookup("role_var", "_traefik_middleware_http", role="guardarr", default=traefik_default_middleware_http) }}
  traefik.http.routers.{{ guardarr_name }}.entrypoints={{ traefik_entrypoint_websecure }}
  traefik.http.routers.{{ guardarr_name }}.service={{ guardarr_name }}
  traefik.http.routers.{{ guardarr_name }}.rule={{ traefik_host_template }}
  traefik.http.routers.{{ guardarr_name }}.priority=20
  traefik.http.routers.{{ guardarr_name }}.tls.certresolver={{ traefik_router_certresolver }}
  traefik.http.routers.{{ guardarr_name }}.tls.options=securetls@file
  traefik.http.routers.{{ guardarr_name }}.middlewares={{ traefik_middleware }}
  traefik.http.services.{{ guardarr_name }}-http.loadbalancer.server.port={{ lookup("role_var", "_web_http_port", role="guardarr", default=traefik_loadbalancer_port) }}
  traefik.http.services.{{ guardarr_name }}-http.loadbalancer.server.scheme={{ lookup("role_var", "_web_http_scheme", role="guardarr", default=traefik_loadbalancer_scheme) }}
  traefik.http.services.{{ guardarr_name }}.loadbalancer.server.port={{ traefik_loadbalancer_port }}
  traefik.http.services.{{ guardarr_name }}.loadbalancer.server.scheme={{ traefik_loadbalancer_scheme }}

guardarr_role_docker_labels_traefik_api: |
  traefik.http.routers.{{ guardarr_name }}-api-http.entrypoints={{ traefik_entrypoint_web }}
  traefik.http.routers.{{ guardarr_name }}-api-http.service={{ guardarr_name }}-api-http
  traefik.http.routers.{{ guardarr_name }}-api-http.rule={{ traefik_host_template }} && ({{ lookup("role_var", "_traefik_api_endpoint", role="guardarr", default=omit) }})
  traefik.http.routers.{{ guardarr_name }}-api-http.priority=30
  traefik.http.routers.{{ guardarr_name }}-api-http.middlewares={{ lookup("role_var", "_traefik_api_middleware_http", role="guardarr", default=traefik_default_middleware_http_api) }}
  traefik.http.routers.{{ guardarr_name }}-api.entrypoints={{ traefik_entrypoint_websecure }}
  traefik.http.routers.{{ guardarr_name }}-api.service={{ guardarr_name }}-api
  traefik.http.routers.{{ guardarr_name }}-api.rule={{ traefik_host_template }} && ({{ lookup("role_var", "_traefik_api_endpoint", role="guardarr", default=omit) }})
  traefik.http.routers.{{ guardarr_name }}-api.priority=30
  traefik.http.routers.{{ guardarr_name }}-api.tls.certresolver={{ traefik_router_certresolver }}
  traefik.http.routers.{{ guardarr_name }}-api.tls.options=securetls@file
  traefik.http.routers.{{ guardarr_name }}-api.middlewares={{ traefik_middleware_api }}
  traefik.http.services.{{ guardarr_name }}-api-http.loadbalancer.server.port={{ lookup("role_var", "_web_api_http_port", role="guardarr", default=lookup("role_var", "_web_api_port", role="guardarr", default=traefik_loadbalancer_port)) }}
  traefik.http.services.{{ guardarr_name }}-api-http.loadbalancer.server.scheme={{ lookup("role_var", "_web_api_http_scheme", role="guardarr", default=lookup("role_var", "_web_api_scheme", role="guardarr", default=traefik_loadbalancer_scheme)) }}
  traefik.http.services.{{ guardarr_name }}-api.loadbalancer.server.port={{ lookup("role_var", "_web_api_port", role="guardarr", default=traefik_loadbalancer_port) }}
  traefik.http.services.{{ guardarr_name }}-api.loadbalancer.server.scheme={{ lookup("role_var", "_web_api_scheme", role="guardarr", default=traefik_loadbalancer_scheme) }}